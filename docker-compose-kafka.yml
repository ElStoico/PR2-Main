services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  messagebroker:
    build:
      context: ./messagebroker
      dockerfile: Dockerfile
    container_name: messagebroker
    ports:
      - "8085:8085"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
      - DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/failed_products_db
      - DATASOURCE_USERNAME=postgres
      - DATASOURCE_PASSWORD=mysecretpassword
      - MONGODB_URI=mongodb://host.docker.internal:27017/broker_message_db
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=renzo.dealbac@gmail.com
      - SPRING_MAIL_PASSWORD=yuozrotqlmgpkwtc
      - APP_MAIL_FROM=renzo.dealbac@gmail.com
      - APP_MAIL_TO=renzo.dealbac@gmail.com
      - APP_PRODUCT_SERVICE_BASE_URL=http://host.docker.internal:8081
      - APP_ALMACEN_BASE_URL=http://host.docker.internal:8081/api/almacen
    depends_on:
      - kafka
